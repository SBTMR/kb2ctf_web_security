name: kb2ctf-xss
services:
  xss:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
    - 127.0.0.1:8083:8080
    networks:
    - xss_net
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=1770
    volumes:
    - xss_data:/var/lib/lab/xss
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
  xss-bot:
    build:
      context: .
      dockerfile: Bot.Dockerfile
    depends_on:
      xss:
        condition: service_healthy
    network_mode: host
    environment:
      FORUM_ORIGIN: http://127.0.0.1:8083
    init: true
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    - seccomp=./bot/seccomp.json
    # Kali's docker-default AppArmor profile may deny Chromium userns_create.
    - apparmor=unconfined
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    shm_size: 128m
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001,mode=1770
    healthcheck:
      test:
      - CMD
      - node
      - /app/bot/health.js
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s
networks:
  xss_net:
    driver: bridge
volumes:
  xss_data: null
